name: build

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "VERSION"
      - "build-app.sh"
      - "Resources/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test --build-system native
      - name: Package app
        run: |
          UNIVERSAL=1 ./build-app.sh
          codesign --verify --strict --deep --verbose=2 TokenBar.app
          codesign -d --verbose=2 TokenBar.app 2>&1 | grep -E "flags|Identifier"
          lipo -archs TokenBar.app/Contents/MacOS/TokenBar
          test -f TokenBar.app/Contents/Resources/AppIcon.icns
          ditto -c -k --keepParent TokenBar.app TokenBar.zip
          shasum -a 256 TokenBar.zip > TokenBar.zip.sha256
          cat TokenBar.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" TokenBar.zip TokenBar.zip.sha256 --target "$GITHUB_SHA" --title "TokenBar $TAG" --notes "TokenBar $TAG ($(lipo -archs TokenBar.app/Contents/MacOS/TokenBar))"
          fi
