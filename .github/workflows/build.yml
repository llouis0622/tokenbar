name: build

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "build-app.sh"
      - "Resources/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test --build-system native
      - name: Package app
        run: |
          ./build-app.sh
          codesign --verify --strict --verbose=2 TokenBar.app
          codesign -d --verbose=2 TokenBar.app 2>&1 | grep -E "flags|Identifier"
          plutil -p TokenBar.app/Contents/Info.plist
          test -f TokenBar.app/Contents/Resources/AppIcon.icns
          ls -l TokenBar.app/Contents/MacOS/TokenBar
          ditto -c -k --keepParent TokenBar.app TokenBar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TokenBar
          path: TokenBar.zip
          retention-days: 14
